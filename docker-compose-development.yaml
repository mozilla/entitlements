x-app: &app
  image: entitlements-dev
  pull_policy: never
  user: '${UID:-1000}:${GID:-1000}'
  volumes:
    - ./apps:/app/apps
    - ./libs:/app/libs
  tmpfs:
    - /app/.nx:mode=1777
  env_file:
    - path: ./dev.env
    - path: ./dev.local.env
      required: false
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  stop_grace_period: 5s

name: entitlements
services:
  api:
    <<: *app
    build:
      context: .
      dockerfile: ./Dockerfile
    command: pnpm nx serve api
    environment:
      PORT: 3037
    ports:
      - '3037:3037'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3037/__heartbeat__').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 180s
    depends_on:
      clickhouse-migrate:
        condition: service_completed_successfully
      firebase:
        condition: service_healthy
      redis:
        condition: service_started

  metering-subscriber:
    <<: *app
    command: pnpm nx serve metering-subscriber
    environment:
      PORT: 3038
    ports:
      - '3038:3038'
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started

  metering-sweep:
    <<: *app
    command: sh -c 'while true; do pnpm nx run metering-sweep:run; sleep 60; done'
    depends_on:
      clickhouse-migrate:
        condition: service_completed_successfully
      firebase:
        condition: service_healthy

  metering-metrics:
    <<: *app
    command: sh -c 'while true; do pnpm nx run metering-metrics:run; sleep 300; done'
    depends_on:
      clickhouse-migrate:
        condition: service_completed_successfully
      firebase:
        condition: service_healthy

  clickhouse-migrate:
    <<: *app
    command: node libs/metering/migrations/clickhouse/migrate.mjs
    restart: 'no'
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.12.3-alpine
    environment:
      CLICKHOUSE_USER: metering_rw
      CLICKHOUSE_PASSWORD: local_metering_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: UTC
    ports:
      - '8124:8123'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8123/ping']
      interval: 2s
      timeout: 5s
      retries: 30
    stop_grace_period: 5s

  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    stop_grace_period: 1s

  firebase:
    image: andreysenov/firebase-tools:latest
    command: firebase emulators:start --project demo-entitlements
    working_dir: /home/node
    volumes:
      - ./_dev/firebase:/home/node
    ports:
      - '8085:8085'
      - '9090:9090'
      - '9299:9299'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9299').then(() => process.exit(0), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 60
    stop_grace_period: 1s

volumes:
  clickhouse-data:
